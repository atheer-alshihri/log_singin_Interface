
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--c1:#1a1a2e;--c2:#16213e;--c3:#0f3460;--acc:#e94560;--acc2:#f5a623;--txt:#fff;--txt2:rgba(255,255,255,0.6);--inp:rgba(255,255,255,0.08);--inp-b:rgba(255,255,255,0.15);--radius:14px}
body{font-family:'Segoe UI',sans-serif;direction:rtl}
.wrap{min-height:520px;background:var(--c1);border-radius:var(--border-radius-lg);display:flex;overflow:hidden;position:relative}
.side{width:220px;background:linear-gradient(160deg,var(--c3),var(--acc) 200%);display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem 1.5rem;gap:1rem;flex-shrink:0}
.side-icon{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-size:24px}
.side-title{font-size:20px;font-weight:600;color:#fff;text-align:center;line-height:1.3}
.side-sub{font-size:13px;color:rgba(255,255,255,0.7);text-align:center}
.side-dots{display:flex;gap:6px;margin-top:1rem}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,0.3)}
.dot.active{background:#fff;width:20px;border-radius:4px}
.main{flex:1;padding:2rem 2.5rem;display:flex;flex-direction:column;justify-content:center;background:var(--c2)}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,0.06);border-radius:10px;padding:4px;margin-bottom:2rem}
.tab{flex:1;padding:9px;text-align:center;font-size:13px;font-weight:500;border-radius:8px;cursor:pointer;color:var(--txt2);transition:all .25s;border:none;background:transparent}
.tab.active{background:var(--acc);color:#fff}
.panel{display:none}
.panel.active{display:block}
.field{margin-bottom:1.1rem}
label{display:block;font-size:12px;color:var(--txt2);margin-bottom:6px;font-weight:500}
input{width:100%;padding:10px 14px;background:var(--inp);border:1px solid var(--inp-b);border-radius:10px;color:var(--txt);font-size:14px;outline:none;transition:border-color .2s;direction:rtl}
input:focus{border-color:var(--acc)}
input::placeholder{color:rgba(255,255,255,0.3)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-main{width:100%;padding:12px;background:var(--acc);border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s;margin-top:.5rem}
.btn-main:hover{opacity:.88}
.btn-main:active{transform:scale(0.98)}
.divider{display:flex;align-items:center;gap:10px;margin:1rem 0;color:var(--txt2);font-size:12px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--inp-b)}
.social-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn-social{padding:9px;background:var(--inp);border:1px solid var(--inp-b);border-radius:10px;color:var(--txt2);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .2s}
.btn-social:hover{background:rgba(255,255,255,0.13)}
.check-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--txt2);margin-bottom:.8rem}
.check-row input[type=checkbox]{width:auto;padding:0;accent-color:var(--acc)}
.forgot{font-size:12px;color:var(--acc2);cursor:pointer;text-decoration:underline;text-underline-offset:3px;margin-top:.4rem;display:inline-block}
.msg{font-size:13px;padding:10px 14px;border-radius:8px;margin-bottom:1rem;display:none}
.msg.success{background:rgba(46,213,115,.15);color:#2ed573;display:block}
.msg.error{background:rgba(233,69,96,.15);color:#e94560;display:block}
.strength{display:flex;gap:4px;margin-top:6px}
.bar{flex:1;height:3px;border-radius:2px;background:var(--inp-b);transition:background .3s}
.bar.weak{background:#e94560}
.bar.ok{background:var(--acc2)}
.bar.strong{background:#2ed573}
</style>

<h2 class="sr-only">نظام تسجيل الدخول وإنشاء الحساب</h2>

<div class="wrap">
  <div class="side">
    <div class="side-icon" aria-hidden="true"><i class="ti ti-shield-lock" style="color:#fff"></i></div>
    <div class="side-title">مرحباً بك!</div>
    <div class="side-sub">سجّل دخولك أو أنشئ حساباً جديداً للاستمرار</div>
    <div class="side-dots">
      <div class="dot active" id="d1"></div>
      <div class="dot" id="d2"></div>
      <div class="dot" id="d3"></div>
    </div>
  </div>
  <div class="main">
    <div class="tabs" role="tablist">
      <button class="tab active" onclick="showPanel('login')" role="tab" aria-selected="true">تسجيل الدخول</button>
      <button class="tab" onclick="showPanel('register')" role="tab" aria-selected="false">حساب جديد</button>
      <button class="tab" onclick="showPanel('forgot')" role="tab" aria-selected="false">نسيت كلمة المرور</button>
    </div>

    <div class="msg" id="msg"></div>

    <div id="panel-login" class="panel active">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" placeholder="example@email.com" id="l-email">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" placeholder="••••••••" id="l-pass">
      </div>
      <div class="check-row">
        <input type="checkbox" id="remember">
        <label for="remember" style="margin:0;cursor:pointer">تذكّرني</label>
        <a class="forgot" style="margin-right:auto" onclick="showPanel('forgot')">نسيت كلمة المرور؟</a>
      </div>
      <button class="btn-main" onclick="doLogin()">تسجيل الدخول</button>
      <div class="divider">أو</div>
      <div class="social-row">
        <button class="btn-social"><i class="ti ti-brand-google" aria-hidden="true"></i> Google</button>
        <button class="btn-social"><i class="ti ti-brand-github" aria-hidden="true"></i> GitHub</button>
      </div>
    </div>

    <div id="panel-register" class="panel">
      <div class="row2">
        <div class="field">
          <label>الاسم الأول</label>
          <input type="text" placeholder="محمد" id="r-fname">
        </div>
        <div class="field">
          <label>الاسم الأخير</label>
          <input type="text" placeholder="علي" id="r-lname">
        </div>
      </div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" placeholder="example@email.com" id="r-email">
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" placeholder="••••••••" id="r-pass" oninput="checkStrength(this.value)">
        <div class="strength" aria-hidden="true">
          <div class="bar" id="b1"></div><div class="bar" id="b2"></div><div class="bar" id="b3"></div>
        </div>
      </div>
      <div class="field">
        <label>تأكيد كلمة المرور</label>
        <input type="password" placeholder="••••••••" id="r-pass2">
      </div>
      <div class="check-row">
        <input type="checkbox" id="terms">
        <label for="terms" style="margin:0;cursor:pointer">أوافق على <span style="color:var(--acc2);cursor:pointer">الشروط والأحكام</span></label>
      </div>
      <button class="btn-main" onclick="doRegister()">إنشاء الحساب</button>
    </div>

    <div id="panel-forgot" class="panel">
      <div style="text-align:center;margin-bottom:1.5rem">
        <div style="width:52px;height:52px;border-radius:50%;background:rgba(233,69,96,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:22px"><i class="ti ti-mail" style="color:var(--acc)" aria-hidden="true"></i></div>
        <div style="font-size:14px;color:var(--txt2)">أدخل بريدك الإلكتروني وسنرسل لك رابط استعادة كلمة المرور</div>
      </div>
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" placeholder="example@email.com" id="f-email">
      </div>
      <button class="btn-main" onclick="doForgot()">إرسال رابط الاستعادة</button>
      <div style="text-align:center;margin-top:1rem">
        <span style="font-size:13px;color:var(--txt2)">تذكّرت كلمة المرور؟ </span>
        <a style="font-size:13px;color:var(--acc2);cursor:pointer;text-decoration:underline" onclick="showPanel('login')">ارجع للدخول</a>
      </div>
    </div>
  </div>
</div>

<script>
const panels={login:'d1',register:'d2',forgot:'d3'};
function showPanel(name){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab').forEach((t,i)=>{t.setAttribute('aria-selected','false')});
  document.getElementById('panel-'+name).classList.add('active');
  const tabs=[...document.querySelectorAll('.tab')];
  const idx={login:0,register:1,forgot:2}[name];
  tabs[idx].classList.add('active');
  tabs[idx].setAttribute('aria-selected','true');
  ['d1','d2','d3'].forEach(d=>document.getElementById(d).classList.remove('active'));
  document.getElementById(panels[name]).classList.add('active');
  showMsg('','');
}
function showMsg(txt,type){
  const m=document.getElementById('msg');
  m.textContent=txt;m.className='msg';
  if(type)m.classList.add(type);
}
function doLogin(){
  const e=document.getElementById('l-email').value.trim();
  const p=document.getElementById('l-pass').value;
  if(!e||!p){showMsg('يرجى تعبئة جميع الحقول','error');return;}
  if(!e.includes('@')){showMsg('البريد الإلكتروني غير صحيح','error');return;}
  showMsg('تم تسجيل الدخول بنجاح! 🎉','success');
}
function doRegister(){
  const fn=document.getElementById('r-fname').value.trim();
  const e=document.getElementById('r-email').value.trim();
  const p=document.getElementById('r-pass').value;
  const p2=document.getElementById('r-pass2').value;
  const t=document.getElementById('terms').checked;
  if(!fn||!e||!p||!p2){showMsg('يرجى تعبئة جميع الحقول','error');return;}
  if(!e.includes('@')){showMsg('البريد الإلكتروني غير صحيح','error');return;}
  if(p!==p2){showMsg('كلمتا المرور غير متطابقتين','error');return;}
  if(p.length<6){showMsg('كلمة المرور يجب أن تكون 6 أحرف على الأقل','error');return;}
  if(!t){showMsg('يجب الموافقة على الشروط والأحكام','error');return;}
  showMsg('تم إنشاء الحساب بنجاح! مرحباً '+fn+' 🎉','success');
}
function doForgot(){
  const e=document.getElementById('f-email').value.trim();
  if(!e||!e.includes('@')){showMsg('يرجى إدخال بريد إلكتروني صحيح','error');return;}
  showMsg('تم إرسال رابط الاستعادة إلى '+e+' ✉️','success');
}
function checkStrength(v){
  const b=[document.getElementById('b1'),document.getElementById('b2'),document.getElementById('b3')];
  b.forEach(x=>{x.className='bar'});
  if(v.length<1)return;
  let s=0;
  if(v.length>=6)s++;
  if(/[A-Z]/.test(v)||/[0-9]/.test(v))s++;
  if(v.length>=10&&/[^a-zA-Z0-9]/.test(v))s++;
  const cls=['weak','ok','strong'];
  for(let i=0;i<s;i++)b[i].classList.add(cls[s-1]);
}
</script>
